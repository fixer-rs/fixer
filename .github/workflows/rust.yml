name: Rust build and test

on:
  push:
    branches: ["wip", "master"]
  pull_request:
    branches: ["wip", "master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Windows too, so native Windows builds (docs/WINDOWS_BUILD.md) stay working.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3
      - name: Build
        run: cargo build --workspace --verbose
      - name: Run tests
        run: cargo test --workspace --verbose

  # Holds the rust-version declared in Cargo.toml to account. Keep the
  # toolchain here in step with it.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@1.94
      - name: Build
        run: cargo build --workspace --all-targets --verbose
      - name: Run tests
        run: cargo test --workspace --verbose
