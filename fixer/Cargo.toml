[package]
authors = ["Karuna Murti <karuna.murti@gmail.com>"]
description = "A full featured messaging engine for the FIX protocol implemented in Rust"
edition = "2024"
homepage = "https://github.com/fixer-rs/fixer.git"
license = "Apache-2.0"
name = "fixer"
readme = "../README.md"
repository = "https://github.com/fixer-rs/fixer.git"
rust-version = "1.85"
version = "0.10.0"

[lib]
name = "fixer"
path = "src/lib.rs"

[dependencies]
addr = "0.15"
async-recursion = "1.0"
atoi_simd = "0.18"
jiff = "0.2"
dashmap = "6.1"
delegate = "0.13"
dyn-clone = "1.0"
enum_dispatch = "0.3"
fast-float2 = "0.2"
futures = "0.3"
itoa = "1.0"
memmem = "0.1.1"
mongodb = { version = "3", optional = true }
parse_duration = "2.1"
quick-xml = { version = "0.39", features = ["serialize"] }
ramhorns = "1.0"
regex = "1.12"
rust_decimal = "1.40"
rustc-hash = "2"
serde = { version = "1.0", features = ["derive"] }
rustls-pemfile = "2"
simple-error = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "mysql"], optional = true }
sscanf = "0.4"
thiserror = "2.0"
tokio-rustls = "0.26"
tokio = { version = "1.49", features = [
  "io-util",
  "io-std",
  "fs",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "macros",
  "time",
  "net",
] }

[features]
default = []
mongo_store = ["mongodb"]
mongo_log = ["mongodb"]
sql_store = ["sqlx"]
sql_log = ["sqlx"]

[dev-dependencies]
criterion = "0.5"
mockall = "0.14"
pprof = { version = "0.15", features = ["flamegraph", "criterion"] }
rcgen = "0.14"
serial_test = "3.0"
tempfile = "3"
tokio-test = "0.4"

[[example]]
name = "echo_server"
path = "../examples/echo_server/main.rs"

[[bench]]
harness = false
name = "fixer_benchmark"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "warn"

[lints.clippy]
# Deny categories
correctness = { level = "deny", priority = -1 }
# Warn categories
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Individual lint overrides (relaxed from pedantic)
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_imports = "allow"
too_many_lines = "allow"
