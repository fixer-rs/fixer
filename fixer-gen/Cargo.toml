[package]
authors = ["Karuna Murti <karuna.murti@gmail.com>"]
description = "Code generator for fixer FIX protocol types"
edition = "2024"
homepage = "https://github.com/fixer-rs/fixer"
license = "Apache-2.0"
name = "fixer-gen"
readme = "../README.md"
repository = "https://github.com/fixer-rs/fixer"
rust-version = "1.85"
version = "0.10.0"

[[bin]]
name = "fixer-gen"
path = "src/main.rs"

[dependencies]
fixer = { path = "../fixer", version = "0.9.0" }
clap = { version = "4", features = ["derive"] }
rustc-hash = "2"
tera = "1"
heck = "0.5"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.49", features = ["rt", "macros"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.49", features = ["rt", "macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_imports = "allow"
too_many_lines = "allow"
