[package]
authors = ["Karuna Murti <karuna.murti@gmail.com>"]
description = "Generated FIX protocol types for fixer"
edition = "2024"
homepage = "https://github.com/fixer-rs/fixer"
license = "Apache-2.0"
name = "fixer-fix"
readme = "../README.md"
repository = "https://github.com/fixer-rs/fixer"
rust-version = "1.85"
version = "0.10.2"
categories = ["finance"]
keywords = ["finance", "fix-protocol", "fix", "protocol"]

[lib]
name = "fixer_fix"
path = "src/lib.rs"

[dependencies]
fixer = { path = "../fixer", version = "0.10.2" }
jiff = "0.2"
rust_decimal = "1"
simple-error = "0.3"

[[example]]
name = "trade_client"
path = "../examples/trade_client/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_imports = "allow"
too_many_lines = "allow"
